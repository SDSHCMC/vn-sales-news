<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam Sales News</title>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#FFFFFF; --soft:#F8FAFC; --field:#F3F4F6; --ink:#0B1220; --muted:#4B5563; --faint:#6B7280; --line:#E5E7EB; --hair:#F0F1F3;
  --accent:#1D4ED8;
  --t-invest:#B45309; --t-tariff:#B91C1C; --t-trade:#1D4ED8; --t-logistics:#0F766E; --t-law:#4338CA; --t-consumer:#BE185D; --t-industry:#4D7C0F;
  color-scheme:light;
}
[data-mode="dark"]{
  --bg:#0E1116; --soft:#141922; --field:#1A202A; --ink:#E8ECF1; --muted:#AEB7C2; --faint:#8C96A3; --line:#232A35; --hair:#1C222C;
  --t-invest:#F5B544; --t-tariff:#F7868F; --t-trade:#7DB8F5; --t-logistics:#5EEAD4; --t-law:#B4A9F5; --t-consumer:#F59CC8; --t-industry:#A6D98A;
  color-scheme:dark;
}
[data-mode="dark"][data-accent="blue"]{--accent:#7DB8F5}
[data-accent="teal"]{--accent:#0F766E} [data-mode="dark"][data-accent="teal"]{--accent:#5EEAD4}
[data-accent="ink"]{--accent:#111827}  [data-mode="dark"][data-accent="ink"]{--accent:#E8ECF1}
[data-accent="rose"]{--accent:#BE123C} [data-mode="dark"][data-accent="rose"]{--accent:#FB7185}
*{box-sizing:border-box}
html{font-size:15px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,Inter,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}

/* header */
.head{padding:calc(1.4rem + env(safe-area-inset-top,0px)) 1.33rem 1.05rem;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;min-height:2.9rem}
.brand{font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--accent);text-transform:uppercase}
html[lang="ko"] .brand{letter-spacing:.04em}
.iconbtn{width:2.9rem;height:2.9rem;margin-right:-.7rem;border:0;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.iconbtn[disabled]{opacity:.5}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.sub{margin:.25rem 0 0;font-size:.93rem;color:var(--muted)}
.search{margin-top:.95rem;display:flex;align-items:center;gap:.65rem;height:2.9rem;padding:0 .95rem;border-radius:10px;background:var(--field)}
.search input{border:0;background:transparent;font-size:1rem;flex:1;min-width:0;outline:none}
.search svg{color:var(--faint);flex:none}

/* sections */
.sec{padding:1.33rem 1.33rem .5rem}
.sec h2{margin:0 0 .5rem;font-size:.87rem;font-weight:700;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
html[lang="ko"] .sec h2{letter-spacing:0}
.band{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.8rem 1.33rem}

.top{display:flex;gap:.95rem;padding:.95rem 0;border-bottom:1px solid var(--hair)}
.top:last-child{border-bottom:0}
.top .n{font-size:1.75rem;font-weight:800;color:var(--accent);line-height:1;width:1.5rem;flex:none}
.top .b{display:flex;flex-direction:column;gap:.35rem;flex:1;min-width:0}
.lab{font-size:.8rem;font-weight:600;color:var(--c);letter-spacing:.02em}
.top .t{font-size:1.13rem;font-weight:700;line-height:1.42}
.top .h{font-size:.87rem;color:var(--muted);line-height:1.5}

.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.05rem}
.topics button{display:flex;justify-content:space-between;align-items:center;height:2.9rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0;font-size:1rem;font-weight:500;cursor:pointer;text-align:left}
.topics button:nth-last-child(-n+2){border-bottom:0}
.topics button b{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.topics button[aria-pressed="true"]{color:var(--accent);font-weight:700}
.topics button[aria-pressed="true"] b{color:var(--accent)}
.topics .saved{color:var(--accent);font-weight:600}
.topics .saved b{color:var(--accent)}

.filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .3rem}
.pill{height:2.1rem;padding:0 .8rem;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:.87rem;color:var(--muted);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.active-topic{display:flex;align-items:center;gap:.5rem;margin:.1rem 0 .4rem;font-size:.87rem;color:var(--muted)}
.active-topic button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:.3rem}

.row{display:flex;gap:.6rem;padding:.8rem 0;border-bottom:1px solid var(--hair);align-items:flex-start}
.row .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25rem}
.meta{font-size:.8rem;color:var(--faint)}
.meta b{color:var(--c);font-weight:600}
.row .t{font-size:1rem;font-weight:600;line-height:1.45}
.orig{font-size:.87rem;color:var(--faint)}
.mini{border:0;background:none;color:var(--faint);font-size:.8rem;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0}
.save{flex:none;width:2.9rem;height:2.9rem;margin:-.4rem -.7rem 0 0;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--faint)}
.save[aria-pressed="true"]{color:var(--accent)}
.watch{background:color-mix(in srgb,var(--t-invest) 22%,transparent);color:inherit;border-radius:3px;padding:0 .15rem}
.more{display:block;width:100%;margin:.8rem 0;height:2.9rem;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.empty{color:var(--faint);text-align:center;padding:2.5rem 1rem}

/* leads */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem;margin-bottom:.6rem}
.stages button{height:3.9rem;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;cursor:pointer;padding:0 .2rem}
.stages b{font-size:1.15rem}
.stages span{font-size:.73rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stages button[aria-pressed="true"]{border:2px solid var(--accent);color:var(--accent)}
.stages button[aria-pressed="true"] span{color:var(--accent);font-weight:600}
.card{border:1px solid var(--line);border-radius:14px;padding:1.05rem;margin-bottom:.7rem;display:flex;flex-direction:column;gap:.6rem;background:var(--bg)}
.card .top-line{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.card .where{font-size:.8rem;font-weight:600;color:var(--muted)}
.card .amt{font-size:1.07rem;font-weight:800;font-variant-numeric:tabular-nums}
.card h3{margin:0;font-size:1.07rem;font-weight:700;line-height:1.42}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.8rem;padding:.15rem .5rem;border-radius:6px;background:var(--field);color:var(--muted)}
.stagetag{font-size:.8rem;padding:.1rem .5rem;border-radius:999px;border:1px solid var(--t-invest);color:var(--t-invest);font-weight:600}
.next{margin:0;font-size:.87rem;color:var(--muted);line-height:1.5}
.next b{color:var(--accent)}
.actions{display:flex;gap:.5rem}
.primary{flex:1;height:2.9rem;border:0;border-radius:10px;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer}
.primary.on{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.ghost{height:2.9rem;padding:0 1.05rem;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;font-weight:600;background:transparent;cursor:pointer}

/* saved */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:2.6rem;border:0;background:transparent;font-size:.87rem;color:var(--muted);cursor:pointer;padding:0 .3rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--field);color:var(--ink);font-weight:700}
.work{display:flex;flex-direction:column;gap:.5rem}
.work .line{display:flex;gap:.5rem;align-items:center}
.work select{height:2.6rem;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0 .5rem;font-size:.87rem}
.st-todo{color:var(--t-invest);font-weight:700}.st-doing{color:var(--t-trade);font-weight:700}.st-done{color:var(--t-industry);font-weight:700}
.work textarea{width:100%;min-height:3.8rem;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:.5rem .65rem;font-size:.93rem}
.savedmsg{font-size:.8rem;color:var(--t-industry);margin-left:auto}
.done h3{color:var(--faint)}

/* settings */
.field{padding:1.05rem 0;border-bottom:1px solid var(--hair);display:flex;flex-direction:column;gap:.6rem}
.field label,.field .lbl{font-size:.93rem;font-weight:600}
.field .note{margin:0;font-size:.87rem;color:var(--faint)}
.fs{display:flex;align-items:center;gap:.6rem}
.fs input{flex:1;accent-color:var(--accent)}
.fs output{min-width:3rem;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sw{display:flex;gap:.6rem}
.sw button{width:2.9rem;height:2.9rem;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;background-clip:content-box;box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 5px var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.foot{margin:1.4rem 0 0;font-size:.8rem;color:var(--faint);line-height:1.6}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;height:4.9rem;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;color:var(--faint);font-size:.73rem;font-weight:500;cursor:pointer;position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .badge{position:absolute;top:.8rem;left:calc(50% + .45rem);min-width:1.15rem;height:1.15rem;padding:0 .3rem;border-radius:999px;background:var(--t-tariff);color:#fff;font-size:.67rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.c-invest{--c:var(--t-invest)} .c-tariff{--c:var(--t-tariff)} .c-trade{--c:var(--t-trade)} .c-logistics{--c:var(--t-logistics)}
.c-law{--c:var(--t-law)} .c-consumer{--c:var(--t-consumer)} .c-industry{--c:var(--t-industry)}
</style>
</head>
<body>
<div class="wrap">

<!-- ───── TODAY ───── -->
<section id="v-today">
  <header class="head">
    <div class="brandrow">
      <span class="brand" data-i18n="brand"></span>
      <button type="button" class="iconbtn" id="refresh" data-i18n-aria="refresh">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
    <h1 id="today-date"></h1>
    <p class="sub" id="today-sub"></p>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" data-i18n-ph="search" data-i18n-aria="search">
    </label>
  </header>
  <div class="sec" id="top-sec">
    <h2 data-i18n="topSignals"></h2>
    <div id="tops"></div>
  </div>
  <div class="band">
    <div class="sec" style="padding:0"><h2 style="margin:.3rem 0 .2rem" data-i18n="byTopic"></h2></div>
    <div class="topics" id="topics"></div>
  </div>
  <div class="sec">
    <h2 data-i18n="latest"></h2>
    <div class="filters" id="period"></div>
    <div class="filters" id="zone"></div>
    <div class="active-topic" id="activeTopic" hidden></div>
    <div id="latest"></div>
  </div>
</section>

<!-- ───── LEADS ───── -->
<section id="v-leads" hidden>
  <header class="head">
    <div class="brandrow"><span class="brand" data-i18n="brand"></span></div>
    <h1 data-i18n="leadsTitle"></h1>
    <p class="sub" data-i18n="leadsSub"></p>
  </header>
  <div class="sec">
    <div class="stages" id="stages"></div>
    <div class="filters" id="leadSort"></div>
    <div id="leads"></div>
  </div>
</section>

<!-- ───── SAVED ───── -->
<section id="v-saved" hidden>
  <header class="head">
    <div class="brandrow"><span class="brand" data-i18n="brand"></span></div>
    <h1 data-i18n="savedTitle"></h1>
    <p class="sub" id="saved-sub"></p>
  </header>
  <div class="sec">
    <div class="seg" id="cstatus" role="group" style="margin-bottom:.9rem"></div>
    <div id="saved"></div>
    <button type="button" class="ghost" id="export" style="width:100%;justify-content:center;margin-top:.4rem" data-i18n="export"></button>
  </div>
</section>

<!-- ───── SETTINGS ───── -->
<section id="v-settings" hidden>
  <header class="head">
    <div class="brandrow"><span class="brand" data-i18n="brand"></span></div>
    <h1 data-i18n="settingsTitle"></h1>
  </header>
  <div class="sec">
    <div class="field"><span class="lbl" data-i18n="language"></span><div class="seg" id="lang" role="group"></div><p class="note" id="langNote" hidden></p></div>
    <div class="field"><span class="lbl" data-i18n="mode"></span><div class="seg" id="mode" role="group"></div></div>
    <div class="field"><label for="fs" data-i18n="fontSize"></label>
      <div class="fs"><button type="button" class="ghost" id="fsDn" aria-label="−">A−</button><input type="range" id="fs" min="12" max="20" step="1"><button type="button" class="ghost" id="fsUp" aria-label="+">A+</button><output id="fsOut"></output></div>
      <p class="note" data-i18n="fsNote"></p></div>
    <div class="field"><span class="lbl" data-i18n="accent"></span><div class="sw" id="accent"></div></div>
    <div class="field" id="collectField"><span class="lbl" data-i18n="collectTitle"></span>
      <button type="button" class="primary" id="collect" data-i18n="collect"></button><p class="note" id="updated"></p></div>
    <p class="foot" data-i18n="footer"></p>
  </div>
</section>
</div>

<nav class="tabs" aria-label="Main"><div class="in" id="tabs"></div></nav>

<script>

function fmtAmount(m){
  if (!m) return "";

  const man = Math.round(m * 100), eok = Math.floor(man / 10000), rest = man % 10000;
  return eok && rest ? `${eok.toLocaleString()}억 ${rest.toLocaleString()}만 달러` : eok ? `${eok.toLocaleString()}억 달러` : `${rest.toLocaleString()}만 달러`;
}

  if (h < 24) return h + T("hourAgo");
  const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate();
}

}

function renderToday(){
  const now = Date.now(), d = new Date();
  const dateFmt = L() === "ko"
    ? `${d.getMonth()+1}월 ${d.getDate()}일 ${"일월화수목금토"[d.getDay()]}요일`
    : d.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"short"});
  document.getElementById("today-date").textContent = dateFmt;
  const n24 = items.filter(it => now - when(it) < 86400000).length;
  const upd = DATA && DATA.updated ? " · " + T("updatedAt")(hhmm(new Date(DATA.updated))) : "";
  document.getElementById("today-sub").textContent = T("newSince")(n24) + upd;

  // 핵심 신호: 24시간 안에서 점수 높은 순, 분야별 1건씩 최대 3건
  const pick = [], seen = new Set();
  const pool = [...items].filter(it => now - when(it) < 86400000).sort((a,b) => b.score - a.score);
  const pool2 = [...items].filter(it => now - when(it) < 3*86400000).sort((a,b) => b.score - a.score);
  for (const it of [...pool, ...pool2]) { if (pick.length >= 3) break; if (seen.has(it.topic) || pick.includes(it)) continue; seen.add(it.topic); pick.push(it); }
  document.getElementById("top-sec").hidden = !pick.length;
  document.getElementById("tops").innerHTML = pick.map((it, i) => {
    const parts = [I18N[L()].topics[it.topic]];
    if (it.topic === "invest" && STAGES.includes(it.stage)) parts.push(I18N[L()].stages[it.stage]);
    if (it.regions && it.regions[0]) parts.push(nm(it.regions[0]));
    if (it.amount_m) parts.push(fmtAmount(it.amount_m));
    return `<a class="top c-${it.topic}" href="${esc(it.link)}" data-link>
      <span class="n">${i+1}</span>
      <span class="b"><span class="lab">${esc(parts.join(" · "))}</span><span class="t">${highlight(titleOf(it), it)}</span><span class="h">${esc(hintOf(it))}</span></span></a>`;
  }).join("");

  // 분야별 개수 (3일)
  const c3 = {}; items.filter(it => now - when(it) < 3*86400000).forEach(it => c3[it.topic] = (c3[it.topic]||0) + 1);
  const open = Object.values(checks).filter(c => c.status !== "완료").length;
  document.getElementById("topics").innerHTML = TOPICS.map(k =>
    `<button type="button" data-topic="${k}" aria-pressed="${state.topic === k}">${I18N[L()].topics[k]} <b>${c3[k]||0}</b></button>`).join("") +
    `<button type="button" class="saved" data-goto="saved">${T("saved")} <b>${open}</b></button>`;

  // 필터
  document.getElementById("period").innerHTML = [[1,"d1"],[3,"d3"],[7,"d7"]].map(([v,k]) =>
    `<button type="button" class="pill" data-days="${v}" aria-pressed="${state.days===v}">${T(k)}</button>`).join("");
  document.getElementById("zone").innerHTML = [["all","zAll"],["북부","zN"],["중부","zC"],["남부","zS"]].map(([v,k]) =>
    `<button type="button" class="pill" data-zone="${v}" aria-pressed="${state.zone===v}">${T(k)}</button>`).join("");
  const at = document.getElementById("activeTopic");
  at.hidden = state.topic === "all";
  if (!at.hidden) at.innerHTML = `${T("showing")}: <b class="c-${state.topic}" style="color:var(--c)">${I18N[L()].topics[state.topic]}</b><button type="button" data-clear>${T("clear")}</button>`;

  // 최신 목록
  const cutoff = now - state.days * 86400000, q = state.q.trim().toLowerCase();
  const list = items.filter(it => {
    if (when(it) < cutoff) return false;
    if (state.topic !== "all" && it.topic !== state.topic) return false;
    if (state.zone !== "all" && !(it.zones || []).includes(state.zone)) return false;
    if (q) { const tags = [...(it.regions||[]), ...(it.industries||[]), ...(it.countries||[])];
      const hay = [it.title_ko, it.title_en, it.title_orig, it.source, I18N.ko.topics[it.topic], I18N.en.topics[it.topic], ...tags, ...tags.map(x => EN_NAMES[x] || "")].join(" ").toLowerCase();
      if (!hay.includes(q)) return false; }
    return true;
  }).sort((a,b) => when(b) - when(a));
  const el = document.getElementById("latest");
  if (!items.length) { el.innerHTML = `<p class="empty">${T("emptyNone")}</p>`; return; }
  if (!list.length) { el.innerHTML = `<p class="empty">${T("emptyFilter")}</p>`; return; }
  const shown = list.slice(0, state.limit), rest = list.length - shown.length;
  el.innerHTML = shown.map(row).join("") + (rest > 0 ? `<button type="button" class="more" id="more">+ ${rest}</button>` : "");
  watchMore();
}
function row(it){

    <div class="b">
      <span class="meta"><b>${I18N[L()].topics[it.topic]}</b> · ${esc(it.source)} · ${ago(when(it))}${it.amount_m ? " · " + esc(fmtAmount(it.amount_m)) : ""}${showOrig ? ` · <button type="button" class="mini" data-orig>${T("orig")}</button>` : ""}</span>
      <a class="t" href="${esc(it.link)}" data-link>${highlight(titleOf(it), it)}</a>
      ${showOrig ? `<span class="orig" hidden>${esc(it.title_orig)}</span>` : ""}
    </div>
    <button type="button" class="save" data-save="${it.id}" aria-pressed="${on}" aria-label="${T("saved")}">${saveIcon(on)}</button>

}
let moreObs = null;
function watchMore(){
  if (!("IntersectionObserver" in window)) return;
  if (moreObs) moreObs.disconnect();
  const m = document.getElementById("more"); if (!m) return;
  moreObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { moreObs.disconnect(); requestAnimationFrame(loadMore); } }, {rootMargin:"800px 0px"});
  moreObs.observe(m);
}

  if (state.tab === "today") renderToday();
  else if (state.tab === "leads") renderLeads();
  else if (state.tab === "saved") renderSaved();
  else renderSettings();
}
function goTab(t){ state.tab = t; try { sessionStorage.setItem("radar-tab", t); } catch(e) {} renderAll(); window.scrollTo(0, 0); }

/* ───── 이벤트 ───── */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.tab) return goTab(d.tab);
  if (d.goto) return goTab(d.goto);
  if (t.hasAttribute("data-link")) { e.preventDefault(); return openLink(t.getAttribute("href")); }
  if (d.save) return toggleSave(d.save);
  if (d.topic) { state.topic = state.topic === d.topic ? "all" : d.topic; state.limit = 40; renderToday();
    document.getElementById("latest").scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if (t.hasAttribute("data-clear")) { state.topic = "all"; state.limit = 40; return renderToday(); }
  if (d.days) { state.days = +d.days; state.limit = 40; return renderToday(); }
  if (d.zone) { state.zone = d.zone; state.limit = 40; return renderToday(); }
  if (t.id === "more") return loadMore();
  if (t.hasAttribute("data-orig")) { const o = t.closest(".b").querySelector(".orig"); o.hidden = !o.hidden; t.textContent = o.hidden ? T("orig") : T("origHide"); return; }
  if (d.stage) { state.stage = d.stage; return renderLeads(); }
  if (d.lsort) { state.leadSort = d.lsort; return renderLeads(); }
  if (d.cstatus) { state.cstatus = d.cstatus; return renderSaved(); }
  if (d.setmode) { settings.mode = d.setmode; saveSettings(); return renderAll(); }
  if (d.setaccent) { settings.accent = d.setaccent; saveSettings(); return renderAll(); }
  if (d.lang) {
    if (d.lang === settings.lang) return;
    settings.lang = d.lang; saveSettings(); renderAll();
    const missing = items.filter(it => !it["title_" + L()] && it.lang !== L()).length;
    if (hasApi() && missing) {
      const n = document.getElementById("langNote"); n.textContent = T("langNote"); n.hidden = false;
      const r = await window.pywebview.api.fill_language(L());
      if (r && r.ok) location.reload(); else n.hidden = true;
    }
    return;
  }
  if (t.id === "fsDn") { settings.fs = Math.max(12, settings.fs - 1); saveSettings(); return renderSettings(); }
  if (t.id === "fsUp") { settings.fs = Math.min(20, settings.fs + 1); saveSettings(); return renderSettings(); }
  if (t.id === "refresh" || t.id === "collect") return doRefresh(t);
  if (t.id === "export") return doExport();
});
document.getElementById("fs").addEventListener("input", e => { settings.fs = +e.target.value; saveSettings(); document.getElementById("fsOut").textContent = settings.fs + "px"; });
let qTimer;
document.getElementById("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; state.limit = 40; renderToday(); }, 200); });
document.addEventListener("change", e => {
  const s = e.target.closest("select[data-status]"); if (!s) return;
  const c = checks[s.dataset.status]; if (!c) return;
  c.status = s.value; persist(s.dataset.status); renderSaved(); renderTabs();
});
const memoTimers = {};
document.addEventListener("input", e => {
  const ta = e.target.closest("textarea[data-memo]"); if (!ta) return;
  const id = ta.dataset.memo, c = checks[id]; if (!c) return;
  c.memo = ta.value; clearTimeout(memoTimers[id]);
  memoTimers[id] = setTimeout(() => persist(id).then(() => {
    const m = document.querySelector(`[data-savedmsg="${id}"]`); if (m) { m.textContent = T("savedOk"); setTimeout(() => m.textContent = "", 1500); } }), 600);
});

async function doRefresh(btn){
  if (WEB || !hasApi()) { location.reload(); return; }
  const icon = document.getElementById("refresh"), col = document.getElementById("collect");
  icon.disabled = true; icon.classList.add("spin"); col.disabled = true; col.textContent = T("busy");
  const r = await window.pywebview.api.refresh();
  if (r && r.ok) location.reload();
  else { icon.disabled = false; icon.classList.remove("spin"); col.disabled = false; col.textContent = T("collect"); alert((r && r.msg) || T("collectFail")); }
}
window.radarBusy = on => { const i = document.getElementById("refresh"); i.disabled = on; i.classList.toggle("spin", on); };

async function doExport(){
  if (hasApi()) { const r = await window.pywebview.api.export_checks();
    alert(r && r.ok ? T("exported") + "\n" + r.path : T("exportFail") + ((r && r.msg) || "")); return; }
  const en = L() === "en";
  const head = en ? ["Saved","Status","Topic","Stage","Title","Original title","Amount","Regions","Source","Memo","Link"]
                  : ["저장일","상태","분야","단계","제목","원문 제목","금액","지역","출처","메모","링크"];
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const rows = Object.values(checks).map(c => { const it = c.item; return [c.checked_at.slice(0,10), T(STATUS_KEY[c.status]), I18N[L()].topics[it.topic] || "",
    STAGES.includes(it.stage) ? I18N[L()].stages[it.stage] : "", titleOf(it), it.title_orig, fmtAmount(it.amount_m), (it.regions||[]).map(nm).join(", "), it.source, c.memo, it.link].map(q).join(","); });
  const blob = new Blob(["﻿" + [head.map(q).join(","), ...rows].join("\r\n")], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = en ? "Vietnam_sales_news_saved.csv" : "베트남_영업뉴스_저장목록.csv"; a.click();
}

if (WEB && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
renderAll();
</script>
</body>
